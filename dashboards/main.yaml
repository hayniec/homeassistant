# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Home Dashboard — Mobile-First Design with Mushroom Cards
#  8 Views: Home, Security, Climate, Lights, Media, Family, Network, Settings
#
#  CUSTOMIZE: Entity IDs use best-guess naming from your integrations.
#  If a card shows "Entity not found", check Settings > Entities for
#  the actual entity_id and update it here.
#
#  Requires HACS: mushroom, mini-graph-card, layout-card,
#  card-mod, mini-media-player, weather-card, apexcharts-card
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

title: Home
views:
  # ════════════════════════════════════════════════════════════════
  #  VIEW 1: HOME OVERVIEW
  # ════════════════════════════════════════════════════════════════
  - title: Home
    path: home
    icon: mdi:home
    badges: []
    cards:
      # ── Welcome Banner ─────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.greeting') }}"
        secondary: >-
          {{ now().strftime('%A, %B %-d') }} · {{ states('sensor.house_status') }}
        icon: mdi:home-heart
        icon_color: indigo
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
              --primary-text-color: #e2e8f0;
              --secondary-text-color: #c7d2fe;
              padding: 8px;
            }
            mushroom-shape-icon {
              --shape-color: rgba(199, 210, 254, 0.2) !important;
              --icon-color: #c7d2fe !important;
            }

      # ── Quick Status Chips ─────────────────────────────────────
      - type: custom:mushroom-chips-card
        alignment: center
        chips:
          - type: entity
            entity: input_select.house_mode
            icon: mdi:home-variant
            tap_action:
              action: more-info
          - type: entity
            entity: sensor.total_lights_on
            icon: mdi:lightbulb-group
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/lights
          - type: entity
            entity: sensor.active_media_players
            icon: mdi:speaker
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/media
          - type: weather
            entity: weather.forecast_home
            show_temperature: true
            show_conditions: true
          - type: template
            icon: mdi:shield-home
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/security
            # CUSTOMIZE: Update alarm entity if different
            entity: alarm_control_panel.alarm_com
            icon_color: >-
              {% set state = states('alarm_control_panel.alarm_com') %}
              {% if state == 'armed_away' %}red
              {% elif state == 'armed_home' %}orange
              {% elif state == 'armed_night' %}purple
              {% else %}green{% endif %}

      # ── Weather Forecast ───────────────────────────────────────
      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: true
        forecast_type: daily
        card_mod:
          style: |
            ha-card { border-radius: 16px; }

      # ── Commute & Travel ───────────────────────────────────────
      - type: grid
        columns: 2
        square: false
        cards:
          # CUSTOMIZE: Update waze entity ID
          - type: custom:mushroom-template-card
            primary: "Commute"
            secondary: >-
              {{ states('sensor.waze_travel_time') }} min
            icon: mdi:car
            icon_color: >-
              {% set t = states('sensor.waze_travel_time') | float(0) %}
              {% if t < 30 %}green{% elif t < 50 %}orange{% else %}red{% endif %}
            tap_action:
              action: more-info
              entity: sensor.waze_travel_time
          # CUSTOMIZE: Update FAA entity ID (check Settings > Entities)
          - type: custom:mushroom-template-card
            primary: "ATL Airport"
            secondary: >-
              {% if is_state('binary_sensor.atl', 'on') %}
                Delays reported
              {% else %}
                No delays
              {% endif %}
            icon: mdi:airplane
            icon_color: >-
              {% if is_state('binary_sensor.atl', 'on') %}red{% else %}green{% endif %}
            tap_action:
              action: more-info
              entity: binary_sensor.atl

      # ── Quick Glance Cards ─────────────────────────────────────
      - type: grid
        columns: 2
        square: false
        cards:
          # Lock Status
          - type: custom:mushroom-template-card
            primary: "Locks"
            secondary: >-
              {{ states('sensor.lock_status') }}
            icon: >-
              {% set l1 = states('lock.aqara_smart_lock_u100') %}
              {% set l2 = states('lock.aqara_smart_lock_u100_2') %}
              {{ 'mdi:lock' if l1 == 'locked' and l2 == 'locked' else 'mdi:lock-open-variant' }}
            icon_color: >-
              {% set l1 = states('lock.aqara_smart_lock_u100') %}
              {% set l2 = states('lock.aqara_smart_lock_u100_2') %}
              {{ 'green' if l1 == 'locked' and l2 == 'locked' else 'red' }}
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/security
          # Thermostat Summary
          - type: custom:mushroom-template-card
            primary: "Climate"
            secondary: >-
              {{ state_attr('climate.upstairs_thermostat', 'current_temperature') | round(0) }}°F upstairs
            icon: mdi:thermostat
            icon_color: orange
            tap_action:
              action: navigate
              navigation_path: /dashboard-main/climate

      # ── Mail & Packages ────────────────────────────────────────
      # CUSTOMIZE: Check your mail_and_packages entity IDs
      - type: custom:mushroom-template-card
        primary: "Mail & Packages"
        secondary: >-
          {{ states('sensor.mail_usps_mail') | default('0') }} mail
          · {{ states('sensor.mail_packages_in_transit') | default('0') }} packages in transit
        icon: mdi:mailbox
        icon_color: brown
        tap_action:
          action: navigate
          navigation_path: /dashboard-main/family

      # ── Sun Position ───────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Sun"
        secondary: >-
          Rise: {{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%I:%M %p') }}
          · Set: {{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%I:%M %p') }}
        icon: >-
          {{ 'mdi:weather-sunny' if is_state('sun.sun', 'above_horizon') else 'mdi:weather-night' }}
        icon_color: >-
          {{ 'amber' if is_state('sun.sun', 'above_horizon') else 'indigo' }}

      # ── House Mode & Quick Toggles ─────────────────────────────
      - type: custom:mushroom-select-card
        entity: input_select.house_mode
        icon: mdi:home-variant
        fill_container: true
        card_mod:
          style: |
            ha-card { border-left: 3px solid #818cf8; }

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: input_boolean.guest_mode
            icon: mdi:account-group
            tap_action:
              action: toggle
            icon_color: amber
            fill_container: true
          - type: custom:mushroom-entity-card
            entity: input_boolean.vacation_mode
            icon: mdi:airplane
            tap_action:
              action: toggle
            icon_color: blue
            fill_container: true
          - type: custom:mushroom-entity-card
            entity: input_boolean.do_not_disturb
            icon: mdi:bell-off
            tap_action:
              action: toggle
            icon_color: red
            fill_container: true
          - type: custom:mushroom-entity-card
            entity: input_boolean.good_night
            icon: mdi:weather-night
            tap_action:
              action: toggle
            icon_color: deep-purple
            fill_container: true

  # ════════════════════════════════════════════════════════════════
  #  VIEW 2: SECURITY
  # ════════════════════════════════════════════════════════════════
  - title: Security
    path: security
    icon: mdi:shield-home
    badges: []
    cards:
      # ── Security Header ────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Security"
        secondary: >-
          {% set alarm = states('alarm_control_panel.alarm_com') | replace('_', ' ') | title %}
          Alarm: {{ alarm }}
          · {% set l1 = states('lock.aqara_smart_lock_u100') %}
          {% set l2 = states('lock.aqara_smart_lock_u100_2') %}
          {% if l1 == 'locked' and l2 == 'locked' %}All locked
          {% else %}Unlocked doors{% endif %}
        icon: mdi:shield-home
        icon_color: green
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #064e3b 0%, #065f46 50%, #047857 100%);
              --primary-text-color: #d1fae5;
              --secondary-text-color: #a7f3d0;
              padding: 8px;
            }
            mushroom-shape-icon {
              --shape-color: rgba(167, 243, 208, 0.2) !important;
              --icon-color: #a7f3d0 !important;
            }

      # ── Alarm Panel ────────────────────────────────────────────
      # CUSTOMIZE: Update alarm entity if different
      - type: alarm-panel
        entity: alarm_control_panel.alarm_com
        states:
          - arm_home
          - arm_away
          - arm_night

      # ── Door Locks ─────────────────────────────────────────────
      - type: grid
        columns: 2
        square: false
        cards:
          # CUSTOMIZE: Update lock entity IDs from Settings > Entities
          - type: custom:mushroom-lock-card
            entity: lock.aqara_smart_lock_u100
            name: Front Door Lock
            fill_container: true
          - type: custom:mushroom-lock-card
            entity: lock.aqara_smart_lock_u100_2
            name: Back Door Lock
            fill_container: true

      # ── Lock Batteries ─────────────────────────────────────────
      - type: grid
        columns: 2
        square: false
        cards:
          # CUSTOMIZE: Update battery sensor entity IDs
          - type: custom:mushroom-template-card
            primary: "Front Lock Battery"
            secondary: >-
              {{ states('sensor.aqara_smart_lock_u100_battery') }}%
            icon: mdi:battery
            icon_color: >-
              {% set b = states('sensor.aqara_smart_lock_u100_battery') | int(0) %}
              {% if b > 50 %}green{% elif b > 20 %}orange{% else %}red{% endif %}
          - type: custom:mushroom-template-card
            primary: "Back Lock Battery"
            secondary: >-
              {{ states('sensor.aqara_smart_lock_u100_2_battery') }}%
            icon: mdi:battery
            icon_color: >-
              {% set b = states('sensor.aqara_smart_lock_u100_2_battery') | int(0) %}
              {% if b > 50 %}green{% elif b > 20 %}orange{% else %}red{% endif %}

      # ── Smoke / CO Alarm ───────────────────────────────────────
      # CUSTOMIZE: Update ZCombo-G entity ID
      - type: custom:mushroom-entity-card
        entity: binary_sensor.zcombo_g_smoke_and_co_detector
        name: "Smoke / CO Alarm"
        icon: mdi:smoke-detector-variant
        fill_container: true

      # ── Wyze Camera Grid ───────────────────────────────────────
      # CUSTOMIZE: Update camera entity IDs from Settings > Entities
      - type: grid
        columns: 2
        square: false
        cards:
          - type: picture-entity
            entity: camera.front_yard_cam
            name: Front Yard
            show_name: true
            show_state: false
            camera_view: auto
          - type: picture-entity
            entity: camera.driveway_cam
            name: Driveway
            show_name: true
            show_state: false
            camera_view: auto
          - type: picture-entity
            entity: camera.garage_cam
            name: Garage
            show_name: true
            show_state: false
            camera_view: auto
          - type: picture-entity
            entity: camera.sideyard_cam
            name: Sideyard
            show_name: true
            show_state: false
            camera_view: auto
          - type: picture-entity
            entity: camera.baby_cam
            name: Baby Cam
            show_name: true
            show_state: false
            camera_view: auto

      # ── UniFi Protect Cameras (if installed) ───────────────────
      # CUSTOMIZE: Add your UniFi Protect camera entities below.
      # After adding UniFi Protect integration, cameras appear as
      # camera.unifi_protect_<name>. Uncomment and update:
      #
      # - type: grid
      #   columns: 2
      #   square: false
      #   cards:
      #     - type: picture-entity
      #       entity: camera.unifi_front_door
      #       name: UniFi Front Door
      #       show_name: true
      #       camera_view: auto
      #     - type: picture-entity
      #       entity: camera.unifi_backyard
      #       name: UniFi Backyard
      #       show_name: true
      #       camera_view: auto

  # ════════════════════════════════════════════════════════════════
  #  VIEW 3: CLIMATE
  # ════════════════════════════════════════════════════════════════
  - title: Climate
    path: climate
    icon: mdi:thermostat
    badges: []
    cards:
      # ── Climate Header ─────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Climate Control"
        secondary: >-
          Outside: {{ state_attr('weather.forecast_home', 'temperature') }}°F
          · {{ state_attr('weather.forecast_home', 'humidity') }}% humidity
        icon: mdi:thermostat
        icon_color: orange
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #7c2d12 0%, #9a3412 50%, #c2410c 100%);
              --primary-text-color: #ffedd5;
              --secondary-text-color: #fed7aa;
              padding: 8px;
            }
            mushroom-shape-icon {
              --shape-color: rgba(254, 215, 170, 0.2) !important;
              --icon-color: #fed7aa !important;
            }

      # ── Upstairs Thermostat (Living Room — ADC-T 3000) ─────────
      # CUSTOMIZE: Update thermostat entity ID
      - type: custom:mushroom-climate-card
        entity: climate.upstairs_thermostat
        name: Upstairs Thermostat
        icon: mdi:thermostat
        show_temperature_control: true
        hvac_modes:
          - "off"
          - heat
          - cool
          - heat_cool
          - auto
        fill_container: true
        collapsible_controls: true

      # ── Basement Thermostat (ADC-T 3000) ───────────────────────
      # CUSTOMIZE: Update thermostat entity ID
      - type: custom:mushroom-climate-card
        entity: climate.basement_thermostat
        name: Basement Thermostat
        icon: mdi:thermostat
        show_temperature_control: true
        hvac_modes:
          - "off"
          - heat
          - cool
          - heat_cool
          - auto
        fill_container: true
        collapsible_controls: true

      # ── Temperature Comparison Graph ───────────────────────────
      - type: custom:mini-graph-card
        name: Temperature Trend
        icon: mdi:home-thermometer
        entities:
          - entity: climate.upstairs_thermostat
            attribute: current_temperature
            name: Upstairs
            color: "#f97316"
          - entity: climate.basement_thermostat
            attribute: current_temperature
            name: Basement
            color: "#818cf8"
          - entity: weather.forecast_home
            attribute: temperature
            name: Outside
            color: "#38bdf8"
        hours_to_show: 24
        points_per_hour: 2
        line_width: 2
        font_size: 75
        animate: true
        show:
          labels: true
          legend: true
          fill: fade

      # ── Dreo Fan / Heater ──────────────────────────────────────
      # CUSTOMIZE: Update Dreo entity IDs from Settings > Entities
      # Dreo devices may appear as fan.dreo_<name> or climate.dreo_<name>
      - type: custom:mushroom-fan-card
        entity: fan.dreo_fan
        name: Dreo Fan
        icon: mdi:fan
        show_percentage_control: true
        show_oscillate_control: true
        fill_container: true
        collapsible_controls: true

      # ── Humidity ───────────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Humidity"
        secondary: >-
          Outdoor: {{ state_attr('weather.forecast_home', 'humidity') }}%
        icon: mdi:water-percent
        icon_color: blue

  # ════════════════════════════════════════════════════════════════
  #  VIEW 4: LIGHTS
  # ════════════════════════════════════════════════════════════════
  - title: Lights
    path: lights
    icon: mdi:lightbulb-group
    badges: []
    cards:
      # ── Lights Header ──────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Lighting"
        secondary: "{{ states('sensor.total_lights_on') }} lights currently on"
        icon: mdi:lightbulb-group
        icon_color: amber
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #78350f 0%, #92400e 50%, #b45309 100%);
              --primary-text-color: #fef3c7;
              --secondary-text-color: #fde68a;
              padding: 8px;
            }
            mushroom-shape-icon {
              --shape-color: rgba(253, 230, 138, 0.2) !important;
              --icon-color: #fde68a !important;
            }

      # ── Bedroom Lights (Wyze Lamps) ────────────────────────────
      # CUSTOMIZE: Update light entity IDs from Settings > Entities
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.lamp_1
            name: Bedroom Lamp 1
            icon: mdi:lamp
            show_brightness_control: true
            show_color_temp_control: true
            use_light_color: true
            fill_container: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.lamp_2
            name: Bedroom Lamp 2
            icon: mdi:lamp
            show_brightness_control: true
            show_color_temp_control: true
            use_light_color: true
            fill_container: true
            collapsible_controls: true

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.lamp_3
            name: Bedroom 2 Lamp
            icon: mdi:lamp
            show_brightness_control: true
            show_color_temp_control: true
            use_light_color: true
            fill_container: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.lamp_4
            name: Bedroom 3 Lamp
            icon: mdi:lamp
            show_brightness_control: true
            show_color_temp_control: true
            use_light_color: true
            fill_container: true
            collapsible_controls: true

      # ── Light Strip (Wyze) ─────────────────────────────────────
      - type: custom:mushroom-light-card
        entity: light.light_strip_1
        name: Light Strip
        icon: mdi:led-strip-variant
        show_brightness_control: true
        show_color_control: true
        use_light_color: true
        fill_container: true
        collapsible_controls: true

      # ── Sengled Bulbs (ZHA) ────────────────────────────────────
      # CUSTOMIZE: Update Sengled entity IDs from Settings > Entities
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.sengled_e11_g13_light
            name: Sengled 1
            icon: mdi:lightbulb
            show_brightness_control: true
            use_light_color: true
            fill_container: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.sengled_e11_g13_light_2
            name: Sengled 2
            icon: mdi:lightbulb
            show_brightness_control: true
            use_light_color: true
            fill_container: true
            collapsible_controls: true
          - type: custom:mushroom-light-card
            entity: light.sengled_e11_g13_light_3
            name: Sengled 3
            icon: mdi:lightbulb
            show_brightness_control: true
            use_light_color: true
            fill_container: true
            collapsible_controls: true

      # ── Outdoor Lighting (Wyze Plugs) ──────────────────────────
      # CUSTOMIZE: String lights and outdoor plugs from Wyze
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.string_lights
            name: String Lights
            icon: mdi:string-lights
            tap_action:
              action: toggle
            icon_color: amber
            fill_container: true
          - type: custom:mushroom-entity-card
            entity: switch.outdoor_plug
            name: Outdoor Plug
            icon: mdi:power-plug
            tap_action:
              action: toggle
            icon_color: cyan
            fill_container: true

      # ── All Lights Off ─────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "All Lights Off"
        secondary: "Turn off every light in the house"
        icon: mdi:lightbulb-off
        icon_color: red
        tap_action:
          action: call-service
          service: light.turn_off
          target:
            entity_id: all
        card_mod:
          style: |
            ha-card { border: 1px solid rgba(239, 68, 68, 0.3); }

  # ════════════════════════════════════════════════════════════════
  #  VIEW 5: MEDIA
  # ════════════════════════════════════════════════════════════════
  - title: Media
    path: media
    icon: mdi:play-circle
    badges: []
    cards:
      # ── Media Header ───────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Media"
        secondary: "{{ states('sensor.active_media_players') }} devices playing"
        icon: mdi:play-circle
        icon_color: pink
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #831843 0%, #9d174d 50%, #be185d 100%);
              --primary-text-color: #fce7f3;
              --secondary-text-color: #fbcfe8;
              padding: 8px;
            }
            mushroom-shape-icon {
              --shape-color: rgba(251, 207, 232, 0.2) !important;
              --icon-color: #fbcfe8 !important;
            }

      # ── YouTube Music ──────────────────────────────────────────
      - type: custom:mini-media-player
        entity: media_player.ytube_music_player
        name: YouTube Music
        artwork: cover
        source: icon
        info: scroll
        volume_stateless: false
        toggle_power: true
        hide:
          shuffle: false
          icon: false

      # ── Plex Server ────────────────────────────────────────────
      # CUSTOMIZE: Update Plex entity ID (check Settings > Entities for "plex")
      - type: custom:mini-media-player
        entity: media_player.plex_zauruspplex
        name: Plex (ZaurusPlex)
        artwork: cover
        source: icon
        info: scroll
        volume_stateless: false
        toggle_power: true
        hide:
          shuffle: true
          icon: false

      # ── Google Cast Devices ────────────────────────────────────
      # CUSTOMIZE: Update these with your actual Google Cast entity IDs.
      # Check Settings > Entities and filter by "media_player" to find them.
      # Common names: media_player.living_room_tv, media_player.bedroom_speaker, etc.
      - type: custom:mini-media-player
        entity: media_player.living_room_tv
        name: Living Room TV
        artwork: cover
        source: icon
        info: scroll
        toggle_power: true
        hide:
          shuffle: true
          icon: false

      - type: custom:mini-media-player
        entity: media_player.bedroom_speaker
        name: Bedroom Speaker
        artwork: cover
        source: icon
        info: scroll
        toggle_power: true
        hide:
          shuffle: true
          icon: false

      - type: custom:mini-media-player
        entity: media_player.kitchen_speaker
        name: Kitchen Speaker
        artwork: cover
        source: icon
        info: scroll
        toggle_power: true

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mini-media-player
            entity: media_player.office_speaker
            name: Office
            artwork: cover
            info: scroll
            toggle_power: true
            hide:
              volume: true
              icon: false
          # CUSTOMIZE: Add more Cast devices as needed
          # - type: custom:mini-media-player
          #   entity: media_player.movie_area_chromecast
          #   name: Movie Area
          #   artwork: cover
          #   info: scroll
          #   toggle_power: true

      # ── Media Browser ──────────────────────────────────────────
      - type: media-control
        entity: media_player.living_room_tv

  # ════════════════════════════════════════════════════════════════
  #  VIEW 6: FAMILY
  # ════════════════════════════════════════════════════════════════
  - title: Family
    path: family
    icon: mdi:account-group
    badges: []
    cards:
      # ── Family Header ──────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Family Hub"
        secondary: >-
          {{ now().strftime('%A, %B %-d, %Y') }}
        icon: mdi:account-group
        icon_color: teal
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #134e4a 0%, #115e59 50%, #0f766e 100%);
              --primary-text-color: #ccfbf1;
              --secondary-text-color: #99f6e4;
              padding: 8px;
            }
            mushroom-shape-icon {
              --shape-color: rgba(153, 246, 228, 0.2) !important;
              --icon-color: #99f6e4 !important;
            }

      # ── Shopping List ──────────────────────────────────────────
      - type: shopping-list
        title: Shopping List

      # ── KidsChores Summary ─────────────────────────────────────
      # CUSTOMIZE: The KidsChores integration creates many entities.
      # Check Settings > Entities and filter by "kidschores" to find
      # your specific entity IDs. Example entities below:
      # - sensor.kidschores_<child_name>_points
      # - sensor.kidschores_<child_name>_completed_today
      # - binary_sensor.kidschores_<child_name>_all_done
      #
      # Replace these placeholder entities with your actual KidsChores entities:
      - type: entities
        title: "KidsChores"
        show_header_toggle: false
        entities:
          - type: custom:mushroom-template-card
            primary: "Open KidsChores"
            secondary: "View chores and progress"
            icon: mdi:checkbox-marked-circle
            icon_color: green
            tap_action:
              action: navigate
              navigation_path: /kidschores
        # Add your KidsChores entities here, e.g.:
        # - entity: sensor.kidschores_child1_points
        #   name: "Child 1 Points"
        # - entity: sensor.kidschores_child2_points
        #   name: "Child 2 Points"

      # ── Google Calendar — Upcoming Events ──────────────────────
      # CUSTOMIZE: Update with your actual calendar entity IDs
      # Check Settings > Entities and filter by "calendar"
      - type: calendar
        title: Family Calendar
        initial_view: listWeek
        entities:
          - calendar.family
          - calendar.personal
          # Add more of your 19 Google calendars as needed
          # - calendar.work
          # - calendar.kids_activities

      # ── Laundry Calendar ───────────────────────────────────────
      - type: calendar
        title: Laundry Schedule
        initial_view: listWeek
        entities:
          - calendar.laundry

      # ── Mail & Packages ────────────────────────────────────────
      # CUSTOMIZE: Update Mail and Packages entity IDs
      - type: entities
        title: "Mail & Packages"
        show_header_toggle: false
        entities:
          - entity: sensor.mail_usps_mail
            name: "USPS Mail Today"
            icon: mdi:email
          - entity: sensor.mail_usps_packages
            name: "USPS Packages"
            icon: mdi:package-variant
          - entity: sensor.mail_packages_in_transit
            name: "In Transit"
            icon: mdi:truck-delivery

      # ── Flight Tracking ────────────────────────────────────────
      # CUSTOMIZE: Update Flightradar24 entity ID
      - type: custom:mushroom-template-card
        primary: "Flights Nearby"
        secondary: >-
          {{ states('sensor.flightradar24_current_in_area') | default('0') }} aircraft in area
        icon: mdi:airplane-search
        icon_color: blue
        tap_action:
          action: more-info
          entity: sensor.flightradar24_current_in_area

  # ════════════════════════════════════════════════════════════════
  #  VIEW 7: NETWORK
  # ════════════════════════════════════════════════════════════════
  - title: Network
    path: network
    icon: mdi:lan
    badges: []
    cards:
      # ── Network Header ─────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Network"
        secondary: "UniFi & System Health"
        icon: mdi:lan
        icon_color: cyan
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #0c4a6e 0%, #075985 50%, #0369a1 100%);
              --primary-text-color: #e0f2fe;
              --secondary-text-color: #bae6fd;
              padding: 8px;
            }
            mushroom-shape-icon {
              --shape-color: rgba(186, 230, 253, 0.2) !important;
              --icon-color: #bae6fd !important;
            }

      # ── UniFi Network Status ───────────────────────────────────
      # CUSTOMIZE: After adding UniFi Network integration, update
      # these entity IDs. Check Settings > Entities, filter "unifi".
      #
      # UniFi Network creates entities like:
      #   sensor.unifi_gateway_wan_download (WAN download speed)
      #   sensor.unifi_gateway_wan_upload (WAN upload speed)
      #   sensor.unifi_gateway_wan_ip (WAN IP)
      #   sensor.unifi_default_clients (connected clients)
      #   update.unifi_network_* (firmware updates)
      #
      # Replace placeholder entities below with your actual UniFi entities:

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: "WAN Download"
            secondary: >-
              {{ states('sensor.unifi_gateway_wan_download') | default('N/A') }} Mbps
            icon: mdi:download
            icon_color: green
          - type: custom:mushroom-template-card
            primary: "WAN Upload"
            secondary: >-
              {{ states('sensor.unifi_gateway_wan_upload') | default('N/A') }} Mbps
            icon: mdi:upload
            icon_color: blue

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-template-card
            primary: "WAN IP"
            secondary: >-
              {{ states('sensor.unifi_gateway_wan_ip') | default('N/A') }}
            icon: mdi:ip-network
            icon_color: purple
          - type: custom:mushroom-template-card
            primary: "Clients"
            secondary: >-
              {{ states('sensor.unifi_default_clients') | default('N/A') }} connected
            icon: mdi:devices
            icon_color: cyan

      # ── UniFi Firmware Updates ─────────────────────────────────
      # CUSTOMIZE: Uncomment and update with your UniFi update entities
      # - type: entities
      #   title: "UniFi Updates"
      #   show_header_toggle: false
      #   entities:
      #     - entity: update.unifi_network_application
      #       name: "Network Controller"
      #     - entity: update.unifi_dream_machine
      #       name: "Dream Machine"
      #     - entity: update.unifi_access_point
      #       name: "Access Point"

      # ── System Health ──────────────────────────────────────────
      - type: custom:mini-graph-card
        name: CPU Usage
        icon: mdi:chip
        entities:
          - entity: sensor.processor_use_percent
            name: CPU
            color: "#818cf8"
        hours_to_show: 6
        line_width: 2
        font_size: 75
        animate: true
        show:
          labels: true
          fill: fade

      - type: custom:mini-graph-card
        name: Memory Usage
        icon: mdi:memory
        entities:
          - entity: sensor.memory_use_percent
            name: Memory
            color: "#f472b6"
        hours_to_show: 6
        line_width: 2
        font_size: 75
        animate: true
        show:
          labels: true
          fill: fade

      - type: custom:mini-graph-card
        name: Disk Usage
        icon: mdi:harddisk
        entities:
          - entity: sensor.disk_use_percent
            name: Disk
            color: "#4ade80"
        hours_to_show: 24
        line_width: 2
        font_size: 75
        animate: true
        show:
          labels: true
          fill: fade

      # ── Printer Status ─────────────────────────────────────────
      # CUSTOMIZE: Update Brother printer entity IDs
      - type: custom:mushroom-template-card
        primary: "Printer"
        secondary: >-
          {{ states('sensor.brother_mfc_l3780cdw_status') | default('Unknown') }}
        icon: mdi:printer
        icon_color: grey
        tap_action:
          action: more-info
          entity: sensor.brother_mfc_l3780cdw_status

  # ════════════════════════════════════════════════════════════════
  #  VIEW 8: SETTINGS
  # ════════════════════════════════════════════════════════════════
  - title: Settings
    path: settings
    icon: mdi:cog
    badges: []
    cards:
      # ── Settings Header ────────────────────────────────────────
      - type: custom:mushroom-template-card
        primary: "Settings & Automations"
        secondary: "Manage your smart home"
        icon: mdi:cog
        icon_color: grey
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
              --primary-text-color: #e2e8f0;
              --secondary-text-color: #cbd5e1;
              padding: 8px;
            }
            mushroom-shape-icon {
              --shape-color: rgba(203, 213, 225, 0.2) !important;
              --icon-color: #cbd5e1 !important;
            }

      # ── House Mode Controls ────────────────────────────────────
      - type: entities
        title: Mode Switches
        show_header_toggle: false
        entities:
          - entity: input_select.house_mode
          - entity: input_boolean.guest_mode
          - entity: input_boolean.vacation_mode
          - entity: input_boolean.do_not_disturb
          - entity: input_boolean.good_night

      # ── Automations ────────────────────────────────────────────
      - type: entities
        title: Automations
        show_header_toggle: false
        entities:
          - entity: automation.sunrise_lights_off
            name: Sunrise Lights Off
            icon: mdi:weather-sunset-up
          - entity: automation.sunset_lights_on
            name: Sunset Ambient Lights
            icon: mdi:weather-sunset-down
          - entity: automation.good_night_automation
            name: Good Night Routine
            icon: mdi:weather-night
          - entity: automation.vacation_random_lights
            name: Vacation Random Lights
            icon: mdi:airplane
          - entity: automation.severe_weather_alert
            name: Severe Weather Alert
            icon: mdi:weather-lightning
          - entity: automation.high_temperature_alert
            name: High Temp Alert
            icon: mdi:thermometer-alert
          - entity: automation.guest_mode_on
            name: Guest Mode Welcome
            icon: mdi:account-group
          - entity: automation.lock_at_night
            name: Lock Doors at Night
            icon: mdi:lock-clock
          - entity: automation.low_lock_battery
            name: Low Lock Battery Alert
            icon: mdi:battery-alert

      # ── System Info ────────────────────────────────────────────
      - type: entities
        title: System Information
        show_header_toggle: false
        entities:
          - entity: sensor.processor_use_percent
            name: CPU Usage
            icon: mdi:chip
          - entity: sensor.memory_use_percent
            name: Memory Usage
            icon: mdi:memory
          - entity: sensor.disk_use_percent
            name: Disk Usage
            icon: mdi:harddisk
          - entity: sensor.processor_temperature
            name: CPU Temperature
            icon: mdi:thermometer
          - entity: sensor.last_boot
            name: Last Boot
            icon: mdi:restart
          - entity: sensor.date_time
            name: Current Date & Time
            icon: mdi:clock

      # ── Quick Navigation ───────────────────────────────────────
      - type: grid
        columns: 2
        square: true
        cards:
          - type: custom:mushroom-template-card
            primary: HACS
            icon: mdi:store
            icon_color: cyan
            tap_action:
              action: navigate
              navigation_path: /hacs
            layout: vertical
          - type: custom:mushroom-template-card
            primary: Devices
            icon: mdi:devices
            icon_color: orange
            tap_action:
              action: navigate
              navigation_path: /config/devices/dashboard
            layout: vertical
          - type: custom:mushroom-template-card
            primary: Integrations
            icon: mdi:puzzle
            icon_color: green
            tap_action:
              action: navigate
              navigation_path: /config/integrations
            layout: vertical
          - type: custom:mushroom-template-card
            primary: Logs
            icon: mdi:text-box
            icon_color: red
            tap_action:
              action: navigate
              navigation_path: /config/logs
            layout: vertical
