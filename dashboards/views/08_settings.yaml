# ════════════════════════════════════════════════════════════════
#  VIEW 8: SETTINGS
# ════════════════════════════════════════════════════════════════
title: Settings
path: settings
icon: mdi:cog
badges: []
cards:
  # ── Settings Header ────────────────────────────────────────
  - type: custom:mushroom-template-card
    primary: "Settings & Automations"
    secondary: "Manage your smart home"
    icon: mdi:cog
    icon_color: grey
    card_mod:
      style: |
        ha-card {
          background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);
          --primary-text-color: #e2e8f0;
          --secondary-text-color: #cbd5e1;
          padding: 8px;
        }
        mushroom-shape-icon {
          --shape-color: rgba(203, 213, 225, 0.2) !important;
          --icon-color: #cbd5e1 !important;
        }

  # ── House Mode Controls ────────────────────────────────────
  - type: entities
    title: Mode Switches
    show_header_toggle: false
    entities:
      - entity: input_select.house_mode
      - entity: input_boolean.guest_mode
      - entity: input_boolean.vacation_mode
      - entity: input_boolean.do_not_disturb
      - entity: input_boolean.good_night

  # ── Automations ────────────────────────────────────────────
  - type: entities
    title: Automations
    show_header_toggle: false
    entities:
      - entity: automation.sunrise_lights_off
        name: Sunrise Lights Off
        icon: mdi:weather-sunset-up
      - entity: automation.sunset_lights_on
        name: Sunset Ambient Lights
        icon: mdi:weather-sunset-down
      - entity: automation.good_night_automation
        name: Good Night Routine
        icon: mdi:weather-night
      - entity: automation.vacation_random_lights
        name: Vacation Random Lights
        icon: mdi:airplane
      - entity: automation.severe_weather_alert
        name: Severe Weather Alert
        icon: mdi:weather-lightning
      - entity: automation.high_temperature_alert
        name: High Temp Alert
        icon: mdi:thermometer-alert
      - entity: automation.guest_mode_on
        name: Guest Mode Welcome
        icon: mdi:account-group
      - entity: automation.lock_at_night
        name: Lock Doors at Night
        icon: mdi:lock-clock
      - entity: automation.low_lock_battery
        name: Low Lock Battery Alert
        icon: mdi:battery-alert

  # ── System Info ────────────────────────────────────────────
  - type: entities
    title: System Information
    show_header_toggle: false
    entities:
      - entity: sensor.processor_use_percent
        name: CPU Usage
        icon: mdi:chip
      - entity: sensor.memory_use_percent
        name: Memory Usage
        icon: mdi:memory
      - entity: sensor.disk_use_percent
        name: Disk Usage
        icon: mdi:harddisk
      - entity: sensor.processor_temperature
        name: CPU Temperature
        icon: mdi:thermometer
      - entity: sensor.last_boot
        name: Last Boot
        icon: mdi:restart
      - entity: sensor.date_time
        name: Current Date & Time
        icon: mdi:clock

  # ── Quick Navigation ───────────────────────────────────────
  - type: grid
    columns: 2
    square: true
    cards:
      - type: custom:mushroom-template-card
        primary: HACS
        icon: mdi:store
        icon_color: cyan
        tap_action:
          action: navigate
          navigation_path: /hacs
        layout: vertical
      - type: custom:mushroom-template-card
        primary: Devices
        icon: mdi:devices
        icon_color: orange
        tap_action:
          action: navigate
          navigation_path: /config/devices/dashboard
        layout: vertical
      - type: custom:mushroom-template-card
        primary: Integrations
        icon: mdi:puzzle
        icon_color: green
        tap_action:
          action: navigate
          navigation_path: /config/integrations
        layout: vertical
      - type: custom:mushroom-template-card
        primary: Logs
        icon: mdi:text-box
        icon_color: red
        tap_action:
          action: navigate
          navigation_path: /config/logs
        layout: vertical
