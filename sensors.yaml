# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  System Monitor
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- platform: systemmonitor
  resources:
    - type: processor_use
    - type: memory_use_percent
    - type: disk_use_percent
      arg: /
    - type: last_boot
    - type: processor_temperature

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Time & Date
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- platform: time_date
  display_options:
    - "time"
    - "date"
    - "date_time"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Season
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- platform: season

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Template Sensors
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
- platform: template
  sensors:
    # ── Greeting based on time of day ─────────────────
    greeting:
      friendly_name: "Greeting"
      value_template: >-
        {% set hour = now().hour %}
        {% if hour < 12 %}Good Morning
        {% elif hour < 17 %}Good Afternoon
        {% elif hour < 21 %}Good Evening
        {% else %}Good Night{% endif %}

    # ── Weather summary for chips/headers ─────────────
    weather_summary:
      friendly_name: "Weather Summary"
      value_template: >-
        {% if states('weather.forecast_home') not in ['unknown', 'unavailable'] %}
          {{ states('weather.forecast_home') | replace('_', ' ') | title }}
          · {{ state_attr('weather.forecast_home', 'temperature') }}°F
        {% else %}Weather unavailable{% endif %}

    # ── House status (lights + doors) ─────────────────
    house_status:
      friendly_name: "House Status"
      value_template: >-
        {% set lights_on = states.light | selectattr('state', 'eq', 'on') | list | count %}
        {% set doors_open = states.binary_sensor
           | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'door')
           | selectattr('state', 'eq', 'on') | list | count %}
        {{ lights_on }} lights on · {{ doors_open }} doors open

    # ── Total lights on ───────────────────────────────
    total_lights_on:
      friendly_name: "Lights On"
      value_template: >-
        {{ states.light | selectattr('state', 'eq', 'on') | list | count }}
      icon_template: mdi:lightbulb-group

    # ── Active media players ──────────────────────────
    active_media_players:
      friendly_name: "Active Media"
      value_template: >-
        {{ states.media_player | selectattr('state', 'eq', 'playing') | list | count }}
      icon_template: mdi:speaker

    # ── Lock status summary ───────────────────────────
    # CUSTOMIZE: Update lock entity IDs if different
    lock_status:
      friendly_name: "Lock Status"
      value_template: >-
        {% set l1 = states('lock.aqara_smart_lock_u100') %}
        {% set l2 = states('lock.aqara_smart_lock_u100_2') %}
        {% if l1 == 'locked' and l2 == 'locked' %}All locked
        {% elif l1 == 'unlocked' and l2 == 'unlocked' %}Both unlocked
        {% elif l1 == 'unlocked' %}Front unlocked
        {% elif l2 == 'unlocked' %}Back unlocked
        {% else %}Unknown{% endif %}
      icon_template: >-
        {% set l1 = states('lock.aqara_smart_lock_u100') %}
        {% set l2 = states('lock.aqara_smart_lock_u100_2') %}
        {{ 'mdi:lock' if l1 == 'locked' and l2 == 'locked' else 'mdi:lock-open-variant' }}

    # ── Alarm status (friendly) ───────────────────────
    # CUSTOMIZE: Update alarm entity ID if different
    alarm_status:
      friendly_name: "Alarm Status"
      value_template: >-
        {{ states('alarm_control_panel.alarm_com') | replace('_', ' ') | title }}
      icon_template: >-
        {% set state = states('alarm_control_panel.alarm_com') %}
        {% if state == 'armed_away' %}mdi:shield-lock
        {% elif state == 'armed_home' %}mdi:shield-home
        {% elif state == 'armed_night' %}mdi:shield-moon
        {% elif state == 'disarmed' %}mdi:shield-off
        {% else %}mdi:shield-alert{% endif %}

    # ── Thermostat summary ────────────────────────────
    # CUSTOMIZE: Update thermostat entity IDs if different
    thermostat_summary:
      friendly_name: "Thermostat Summary"
      value_template: >-
        Up: {{ state_attr('climate.upstairs_thermostat', 'current_temperature') | round(0) }}°F
        · Down: {{ state_attr('climate.basement_thermostat', 'current_temperature') | round(0) }}°F
      icon_template: mdi:thermostat
