# Home Assistant Configuration
# https://www.home-assistant.io/docs/configuration/

homeassistant:
  name: Home
  unit_system: imperial
  time_zone: America/New_York
  currency: USD
  # CUSTOMIZE: Set to your external access URL (e.g. Tailscale/Cloudflare tunnel)
  # external_url: "https://your-home.example.com"
  internal_url: "http://homeassistant.local:8123"
  customize: !include customize.yaml

# Default integrations
default_config:

# Browser Mod
browser_mod:

# Text-to-Speech
tts:
  - platform: google_translate

# Frontend & Themes
frontend:
  themes: !include_dir_merge_named themes/

# Lovelace Dashboards
lovelace:
  mode: storage
  resources:
    # Mushroom Cards (install via HACS)
    - url: /hacsfiles/lovelace-mushroom/mushroom.js
      type: module
    # Mini Graph Card (install via HACS)
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
    # layout-card (install via HACS)
    - url: /hacsfiles/lovelace-layout-card/layout-card.js
      type: module
    # card-mod (install via HACS)
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    # mini-media-player (install via HACS)
    - url: /hacsfiles/mini-media-player/mini-media-player-bundle.js
      type: module
    # weather-card (install via HACS)
    - url: /hacsfiles/weather-card/weather-card.js
      type: module
    # ApexCharts Card (install via HACS)
    - url: /hacsfiles/apexcharts-card/apexcharts-card.js
      type: module
    # Swipe Card (install via HACS)
    - url: /hacsfiles/swipe-card/swipe-card.js
      type: module
    # Decluttering Card (install via HACS)
    - url: /hacsfiles/decluttering-card/decluttering-card.js
      type: module
  dashboards:
    dashboard-main:
      mode: yaml
      filename: dashboards/main.yaml
      title: Home Dashboard
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Weather (Met.no configured via UI)
weather:

# Recorder & History
recorder:
  purge_keep_days: 10
  commit_interval: 1

history:

logbook:

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Input Helpers — House Modes & Toggles
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
input_boolean:
  guest_mode:
    name: Guest Mode
    icon: mdi:account-group
  vacation_mode:
    name: Vacation Mode
    icon: mdi:airplane
  good_night:
    name: Good Night Mode
    icon: mdi:weather-night
  do_not_disturb:
    name: Do Not Disturb
    icon: mdi:bell-off

input_select:
  house_mode:
    name: House Mode
    options:
      - Home
      - Away
      - Night
      - Guest
      - Vacation
    initial: Home
    icon: mdi:home-variant

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Integration Notes (configured via Settings > Integrations UI)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Alarm.com          — Security system (alarm_control_panel.alarm_com)
# Aqara / Matter     — 2x U100 Smart Locks via Aqara Hub M3
# Brother IPP        — MFC-L3780CDW printer
# Dreo               — Smart fans/heaters
# FAA Delays         — ATL airport
# Flightradar24      — Flight tracking
# Google Calendar    — 19 calendars
# Google Cast        — 20+ Chromecast/Home/Nest devices
# Google TTS         — Text-to-speech
# Google Home        — Google Home integration
# HomeKit Device     — Aqara Hub M3
# KidsChores (HACS)  — Chore tracker (154 entities)
# Local Calendar     — Laundry schedule
# Mail & Packages    — USPS tracking
# Matter             — Aqara Hub M3 + 2x U100 locks
# Met.no             — Weather (weather.forecast_home)
# MQTT / Mosquitto   — Broker for Zigbee2mqtt
# Plex               — ZaurusPlex media server + clients
# Radio Browser      — Internet radio directory
# Shopping List      — Built-in shopping list
# Sun                — Solar position (sun.sun)
# UniFi Network      — Add via Settings > Integrations > UniFi Network
# UniFi Protect      — Add via Settings > Integrations > UniFi Protect (if you have NVR)
# Waze Travel Time   — Commute tracking
# Wyze (HACS)        — 5 cameras, 4 lamps, light strip, plugs
# ytube_music_player — YouTube Music
# Z-Wave JS          — 2x ADC-T 3000 thermostats, ZCombo-G smoke/CO, HUSBZB-1
# ZHA                — 3x Sengled E11-G13 bulbs via HUSBZB-1
# Zigbee2mqtt        — Zigbee devices via Mosquitto

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  Template Sensors (modern syntax)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
template:
  - sensor:
      # ── Greeting based on time of day ─────────────────
      - name: "Greeting"
        state: >-
          {% set hour = now().hour %}
          {% if hour < 12 %}Good Morning
          {% elif hour < 17 %}Good Afternoon
          {% elif hour < 21 %}Good Evening
          {% else %}Good Night{% endif %}

      # ── Weather summary for chips/headers ─────────────
      - name: "Weather Summary"
        state: >-
          {% if states('weather.forecast_home') not in ['unknown', 'unavailable'] %}
            {{ states('weather.forecast_home') | replace('_', ' ') | title }}
            · {{ state_attr('weather.forecast_home', 'temperature') }}°F
          {% else %}Weather unavailable{% endif %}

      # ── House status (lights + doors) ─────────────────
      - name: "House Status"
        state: >-
          {% set lights_on = states.light | selectattr('state', 'eq', 'on') | list | count %}
          {% set doors_open = states.binary_sensor
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'eq', 'door')
             | selectattr('state', 'eq', 'on') | list | count %}
          {{ lights_on }} lights on · {{ doors_open }} doors open

      # ── Total lights on ───────────────────────────────
      - name: "Lights On"
        icon: mdi:lightbulb-group
        state: >-
          {{ states.light | selectattr('state', 'eq', 'on') | list | count }}

      # ── Active media players ──────────────────────────
      - name: "Active Media"
        icon: mdi:speaker
        state: >-
          {{ states.media_player | selectattr('state', 'eq', 'playing') | list | count }}

      # ── Lock status summary ───────────────────────────
      # CUSTOMIZE: Update lock entity IDs if different
      - name: "Lock Status"
        icon: >-
          {% set l1 = states('lock.aqara_smart_lock_u100') %}
          {% set l2 = states('lock.aqara_smart_lock_u100_2') %}
          {{ 'mdi:lock' if l1 == 'locked' and l2 == 'locked' else 'mdi:lock-open-variant' }}
        state: >-
          {% set l1 = states('lock.aqara_smart_lock_u100') %}
          {% set l2 = states('lock.aqara_smart_lock_u100_2') %}
          {% if l1 == 'locked' and l2 == 'locked' %}All locked
          {% elif l1 == 'unlocked' and l2 == 'unlocked' %}Both unlocked
          {% elif l1 == 'unlocked' %}Front unlocked
          {% elif l2 == 'unlocked' %}Back unlocked
          {% else %}Unknown{% endif %}

      # ── Alarm status (friendly) ───────────────────────
      # CUSTOMIZE: Update alarm entity ID if different
      - name: "Alarm Status"
        icon: >-
          {% set state = states('alarm_control_panel.alarm_com') %}
          {% if state == 'armed_away' %}mdi:shield-lock
          {% elif state == 'armed_home' %}mdi:shield-home
          {% elif state == 'armed_night' %}mdi:shield-moon
          {% elif state == 'disarmed' %}mdi:shield-off
          {% else %}mdi:shield-alert{% endif %}
        state: >-
          {{ states('alarm_control_panel.alarm_com') | replace('_', ' ') | title }}

      # ── Thermostat summary ────────────────────────────
      # CUSTOMIZE: Update thermostat entity IDs if different
      - name: "Thermostat Summary"
        icon: mdi:thermostat
        state: >-
          Up: {{ state_attr('climate.upstairs_thermostat', 'current_temperature') | round(0) }}°F
          · Down: {{ state_attr('climate.basement_thermostat', 'current_temperature') | round(0) }}°F

# Includes
sensor: !include sensors.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
group: !include groups.yaml

# Shell commands
shell_command:
