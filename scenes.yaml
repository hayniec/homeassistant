# CUSTOMIZE: Update entity IDs to match your actual devices

- name: Movie Night
  icon: mdi:movie-open
  entities:
    light.lamp_1:
      state: "off"
    light.lamp_2:
      state: "off"
    light.light_strip_1:
      state: "on"
      brightness: 30
    light.sengled_e11_g13_light:
      state: "off"

